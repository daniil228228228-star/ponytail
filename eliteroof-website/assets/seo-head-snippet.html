<!--
  Выбор типа: используется "RoofingContractor" — это более специфичный
  подтип "HomeAndConstructionBusiness" (который, в свою очередь, является
  подтипом LocalBusiness). Он точнее описывает деятельность компании
  (кровельные работы) и полностью валиден в schema.org. Поисковые системы
  (включая Google) обрабатывают неизвестные им специфичные подтипы через
  ближайшего валидного родителя (LocalBusiness/HomeAndConstructionBusiness),
  поэтому потери в совместимости нет — а специфичность типа может быть
  дополнительным плюсом для семантического понимания страницы.
  Если потребуется более широкая поддержка конкретным инструментом валидации,
  тип можно заменить на "HomeAndConstructionBusiness" без изменения остальных полей.
-->

  "taxID": "[ИНН]",
  "priceRange": "[ЦЕНОВОЙ ДИАПАЗОН]",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "[АДРЕС]",
    "addressLocality": "[ГОРОД]",
    "addressCountry": "RU"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": "[ШИРОТА]",
    "longitude": "[ДОЛГОТА]"
  },
  "openingHours": "[ГРАФИК РАБОТЫ]",
